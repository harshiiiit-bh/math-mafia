<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>find X — Class 10 Maths Short Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FIND X — DESIGN SYSTEM
   Palette: chalkboard slate + chalk pigments
   ============================================================ */
:root{
  --board-0:#0e1a16;
  --board-1:#122420;
  --board-2:#16302a;
  --chalk-white:#f2efe3;
  --chalk-dim:#b9c4bd;
  --chalk-yellow:#ffcf56;
  --chalk-teal:#5fd9c7;
  --chalk-coral:#ff7a6b;
  --chalk-blue:#7ec8ff;
  --chalk-violet:#c9a6ff;
  --rule-line: rgba(242,239,227,0.09);
  --wood:#4a3423;
  --wood-dark:#2f2013;
  --shadow: rgba(0,0,0,0.45);
  --radius: 14px;
  --serif-display:'Kalam', cursive;
  --sans:'Space Grotesk', sans-serif;
  --mono:'JetBrains Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--sans);
  color:var(--chalk-white);
  background:var(--board-0);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--chalk-yellow); color:var(--board-0); }

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
}

/* ---------- chalkboard texture ---------- */
.board-texture{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.035), transparent 40%),
    radial-gradient(ellipse at 80% 85%, rgba(255,255,255,0.03), transparent 45%),
    repeating-linear-gradient(0deg, transparent, transparent 38px, var(--rule-line) 39px),
    repeating-linear-gradient(90deg, transparent, transparent 38px, var(--rule-line) 39px),
    linear-gradient(160deg, var(--board-1), var(--board-0) 60%, var(--board-2));
  opacity:0.9;
}
.board-texture::after{
  content:"";
  position:absolute; inset:0;
  background-image:
    radial-gradient(circle at 12% 30%, rgba(255,255,255,0.05) 0.5px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,0.04) 0.5px, transparent 1px),
    radial-gradient(circle at 40% 80%, rgba(255,255,255,0.05) 0.5px, transparent 1px);
  background-size: 180px 180px, 220px 220px, 260px 260px;
  mix-blend-mode:screen;
}

/* wooden frame edge */
.frame-edge{
  position:fixed; inset:0; z-index:5; pointer-events:none;
  box-shadow: inset 0 0 0 14px var(--wood), inset 0 0 0 20px var(--wood-dark), inset 0 0 60px 20px rgba(0,0,0,0.55);
}
@media (max-width:700px){
  .frame-edge{ box-shadow: inset 0 0 0 8px var(--wood), inset 0 0 0 12px var(--wood-dark), inset 0 0 40px 14px rgba(0,0,0,0.5); }
}

/* floating symbols background */
#symbolField{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
.sym{
  position:absolute; top:110%; font-family:var(--mono); color:var(--chalk-white);
  opacity:0.09; animation-name:floatUp; animation-timing-function:linear; animation-iteration-count:infinite;
  user-select:none;
}
@keyframes floatUp{
  0%{ transform:translateY(0) rotate(0deg); opacity:0; }
  8%{ opacity:0.12; }
  92%{ opacity:0.1; }
  100%{ transform:translateY(-130vh) rotate(25deg); opacity:0; }
}

/* ---------- layout shell ---------- */
#app{ position:relative; z-index:2; min-height:100vh; }
.screen{ display:none; min-height:100vh; }
.screen.active{ display:block; animation:screenIn 0.55s cubic-bezier(.2,.8,.2,1); }
@keyframes screenIn{
  from{ opacity:0; transform:translateY(14px) scale(0.995); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}

/* scroll progress bar */
#progressBar{
  position:fixed; top:0; left:0; height:3px; width:0%; z-index:50;
  background:linear-gradient(90deg,var(--chalk-teal),var(--chalk-yellow),var(--chalk-coral));
  transition:width 0.12s linear;
}

/* ---------- top nav ---------- */
.topnav{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px; gap:16px;
  background:linear-gradient(180deg, rgba(14,26,22,0.92), rgba(14,26,22,0.55) 80%, transparent);
  backdrop-filter:blur(6px);
}
.brand{
  display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;
  font-family:var(--serif-display); font-size:1.7rem; color:var(--chalk-white);
  letter-spacing:0.5px;
}
.brand .x-mark{ color:var(--chalk-yellow); position:relative; }
.brand .x-mark::after{
  content:""; position:absolute; left:-4px; right:-4px; bottom:-3px; height:6px;
  border-bottom:2px dashed var(--chalk-coral); opacity:0.6; border-radius:50%;
}
.nav-actions{ display:flex; align-items:center; gap:14px; }
.chip{
  font-family:var(--mono); font-size:0.72rem; color:var(--chalk-dim);
  border:1px solid var(--rule-line); padding:5px 10px; border-radius:20px;
}
.backbtn{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  font-family:var(--sans); font-weight:500; font-size:0.9rem; color:var(--chalk-teal);
  background:rgba(95,217,199,0.08); border:1px solid rgba(95,217,199,0.35);
  padding:8px 14px; border-radius:30px; transition:all 0.25s ease;
}
.backbtn:hover{ background:rgba(95,217,199,0.18); transform:translateX(-3px); }

/* ---------- HERO / TOC ---------- */
.hero{ padding:40px 6vw 10px; text-align:center; position:relative; }
.hero h1{
  font-family:var(--serif-display); font-size:clamp(3rem,9vw,6.2rem); margin:0 0 6px;
  line-height:0.95; color:var(--chalk-white);
}
.hero h1 .find{ display:block; font-size:0.32em; letter-spacing:8px; color:var(--chalk-dim); font-family:var(--mono); font-weight:500; margin-bottom:6px; }
.hero h1 .xx{ color:var(--chalk-yellow); text-shadow:0 0 30px rgba(255,207,86,0.35); }
.hero p.sub{
  font-family:var(--mono); color:var(--chalk-dim); max-width:620px; margin:14px auto 0; font-size:0.95rem; line-height:1.7;
}
.hero-mascot-wrap{ display:flex; justify-content:center; margin:10px 0 -10px; }
.fight-anim{ display:block; width:min(360px,82vw); height:auto; margin:20px auto 4px; }
.fight-caption{ text-align:center; font-size:0.78rem; opacity:0.7; margin-top:2px; }

/* underline squiggle */
.squiggle{ width:220px; height:18px; margin:18px auto; opacity:0.7; }

/* class stat strip */
.stat-strip{
  display:flex; justify-content:center; gap:34px; flex-wrap:wrap; margin:26px auto 6px;
  font-family:var(--mono); font-size:0.78rem; color:var(--chalk-dim);
}
.stat-strip b{ color:var(--chalk-teal); font-size:1.05rem; display:block; font-family:var(--sans); }

/* ---------- chapter grid ---------- */
.toc-wrap{ padding:20px 6vw 90px; max-width:1280px; margin:0 auto; }
.toc-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:22px; margin-top:20px;
}
.tile{
  position:relative; border-radius:var(--radius); padding:22px 20px 20px;
  background:linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
  border:1px solid var(--rule-line);
  cursor:pointer; overflow:hidden; opacity:0; transform:translateY(24px);
  transition:transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s, border-color 0.35s, background 0.35s;
}
.tile.reveal{ animation:tileIn 0.6s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes tileIn{ to{ opacity:1; transform:translateY(0);} }
.tile:hover{
  transform:translateY(-6px);
  border-color:var(--accent,var(--chalk-yellow));
  box-shadow:0 18px 40px -12px var(--shadow), 0 0 0 1px var(--accent,var(--chalk-yellow)) inset;
  background:linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
}
.tile .num{
  font-family:var(--mono); font-size:0.72rem; color:var(--accent,var(--chalk-yellow)); opacity:0.85;
  letter-spacing:1px;
}
.tile h3{
  font-family:var(--serif-display); font-size:1.5rem; margin:6px 0 8px; color:var(--chalk-white); line-height:1.15;
}
.tile p{ font-family:var(--sans); font-size:0.82rem; color:var(--chalk-dim); margin:0 0 14px; line-height:1.5; min-height:38px;}
.tile .icon-slot{
  position:absolute; right:14px; top:14px; width:50px; height:50px; opacity:0.85;
  color:var(--accent,var(--chalk-yellow));
  transition:transform 0.4s ease;
}
.tile:hover .icon-slot{ transform:rotate(8deg) scale(1.08); }
.tile .goto{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:0.72rem;
  color:var(--accent,var(--chalk-yellow)); opacity:0.9;
}
.tile .goto svg{ width:14px; height:14px; transition:transform 0.3s; }
.tile:hover .goto svg{ transform:translateX(4px); }
.tile .chalk-dust{ position:absolute; inset:0; pointer-events:none; opacity:0; }
.tile:hover .chalk-dust{ opacity:1; }

/* footer */
.site-footer{
  text-align:center; padding:30px 20px 50px; font-family:var(--mono); font-size:0.72rem; color:var(--chalk-dim); opacity:0.75;
}
.site-footer .credit{ color:var(--chalk-yellow); }

/* ---------- CHAPTER PAGE ---------- */
.chapter-head{
  padding:26px 6vw 20px; position:relative;
}
.chapter-head .kicker{
  font-family:var(--mono); font-size:0.78rem; letter-spacing:2px; color:var(--accent,var(--chalk-yellow)); text-transform:uppercase;
}
.chapter-head h1{
  font-family:var(--serif-display); font-size:clamp(2.2rem,6vw,3.6rem); margin:8px 0 10px; color:var(--chalk-white);
}
.chapter-head .tagline{ font-family:var(--sans); color:var(--chalk-dim); max-width:680px; font-size:1rem; line-height:1.6;}
.chapter-hero-icon{ position:absolute; right:6vw; top:14px; width:110px; height:110px; opacity:0.18; color:var(--accent,var(--chalk-yellow)); }
@media (max-width:820px){ .chapter-hero-icon{ display:none; } }

.chapter-nav-strip{
  display:flex; gap:10px; flex-wrap:wrap; padding:0 6vw 10px; font-family:var(--mono); font-size:0.72rem;
}
.chapter-nav-strip a{
  color:var(--chalk-dim); text-decoration:none; border:1px solid var(--rule-line); padding:5px 11px; border-radius:20px;
  transition:all 0.25s;
}
.chapter-nav-strip a:hover{ color:var(--accent,var(--chalk-yellow)); border-color:var(--accent,var(--chalk-yellow)); }

.chapter-body{ max-width:900px; margin:0 auto; padding:10px 6vw 100px; }

.section-block{
  margin:34px 0; opacity:0; transform:translateY(18px);
}
.section-block.reveal{ animation:tileIn 0.6s cubic-bezier(.2,.8,.2,1) forwards; }

.section-block h2{
  font-family:var(--serif-display); font-size:1.7rem; color:var(--chalk-white);
  display:flex; align-items:center; gap:10px; margin-bottom:14px;
  border-bottom:2px dashed var(--rule-line); padding-bottom:10px;
}
.section-block h2 .tag{
  font-family:var(--mono); font-size:0.65rem; color:var(--board-0); background:var(--accent,var(--chalk-yellow));
  padding:3px 9px; border-radius:20px; letter-spacing:1px; text-transform:uppercase;
}
.section-block ul{ padding-left:22px; margin:10px 0; }
.section-block li{ margin:8px 0; line-height:1.65; color:var(--chalk-white); font-size:0.98rem; }
.section-block li b, .section-block p b{ color:var(--accent,var(--chalk-yellow)); font-weight:600; }
.section-block p{ line-height:1.75; color:var(--chalk-white); font-size:0.98rem; }
.mathf{ font-family:var(--mono); background:rgba(255,255,255,0.06); padding:1px 7px; border-radius:5px; color:var(--chalk-teal); font-size:0.92em; white-space:nowrap;}

/* callout boxes */
.callout{
  border-radius:12px; padding:18px 20px; margin:14px 0; position:relative;
  border:1px solid var(--rule-line); background:rgba(255,255,255,0.03);
}
.callout.theorem{ border-left:4px solid var(--chalk-blue); }
.callout.theorem .label{ color:var(--chalk-blue); }
.callout.extra{ border-left:4px solid var(--chalk-violet); background:rgba(201,166,255,0.05); }
.callout.extra .label{ color:var(--chalk-violet); }
.callout.trick{ border-left:4px solid var(--chalk-coral); background:rgba(255,122,107,0.05); }
.callout.trick .label{ color:var(--chalk-coral); }
.callout.facts{ border-left:4px solid var(--chalk-yellow); background:rgba(255,207,86,0.045); }
.callout.facts .label{ color:var(--chalk-yellow); }
.callout .label{
  font-family:var(--mono); font-size:0.7rem; text-transform:uppercase; letter-spacing:1.5px; margin-bottom:8px; display:block; font-weight:600;
}
.callout ol{ padding-left:20px; margin:6px 0 0; }
.callout li{ margin:6px 0; line-height:1.6; font-size:0.94rem; }

/* formula sheet */
.formula-sheet{
  margin:40px 0 10px; border-radius:16px; padding:26px 24px;
  background:linear-gradient(160deg, rgba(255,207,86,0.07), rgba(255,255,255,0.02));
  border:1px solid rgba(255,207,86,0.28);
  position:relative; overflow:hidden;
}
.formula-sheet::before{
  content:"⌘ FORMULA SHEET"; display:none;
}
.formula-sheet h2{
  font-family:var(--serif-display); font-size:1.7rem; color:var(--chalk-yellow); margin:0 0 4px;
  display:flex; align-items:center; gap:10px;
}
.formula-sheet .fs-sub{ font-family:var(--mono); font-size:0.72rem; color:var(--chalk-dim); margin-bottom:16px; display:block;}
.formula-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
.formula-card{
  background:rgba(0,0,0,0.22); border:1px solid rgba(255,255,255,0.06); border-radius:10px; padding:12px 14px;
  transition:transform 0.25s, border-color 0.25s;
}
.formula-card:hover{ transform:translateY(-3px); border-color:var(--chalk-yellow); }
.formula-card .fname{ font-family:var(--sans); font-size:0.74rem; color:var(--chalk-dim); margin-bottom:5px; }
.formula-card .fexpr{ font-family:var(--mono); font-size:1rem; color:var(--chalk-white); }

/* ratio / reference table */
.ratio-table-wrap{ overflow-x:auto; margin:14px 0; border-radius:12px; border:1px solid var(--rule-line); }
table.ratio-table{ border-collapse:collapse; width:100%; min-width:520px; font-family:var(--mono); }
table.ratio-table th, table.ratio-table td{ padding:11px 14px; text-align:center; border-bottom:1px solid var(--rule-line); font-size:0.92rem; white-space:nowrap; }
table.ratio-table thead th{ background:rgba(255,207,86,0.1); color:var(--chalk-yellow); font-family:var(--sans); font-weight:600; }
table.ratio-table td.rowlabel{ text-align:left; color:var(--chalk-teal); font-weight:600; background:rgba(255,255,255,0.03); }
table.ratio-table tbody tr:last-child td{ border-bottom:none; }
table.ratio-table tbody tr:hover td{ background:rgba(255,255,255,0.04); }

/* shape reference cards */
.shape-sheet{ background:linear-gradient(160deg, rgba(126,200,255,0.07), rgba(255,255,255,0.02)); border-color:rgba(126,200,255,0.28); }
.shape-sheet h2{ color:var(--chalk-blue); }
.shape-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; }
.shape-card{
  background:rgba(0,0,0,0.22); border:1px solid rgba(255,255,255,0.07); border-radius:12px; padding:16px 16px 14px;
  transition:transform 0.25s, border-color 0.25s;
}
.shape-card:hover{ transform:translateY(-4px); border-color:var(--chalk-blue); }
.shape-icon{ width:38px; height:38px; color:var(--chalk-blue); margin-bottom:6px; }
.shape-name{ font-family:var(--serif-display); font-size:1.15rem; color:var(--chalk-white); margin-bottom:8px; }
.shape-rows{ display:flex; flex-direction:column; gap:6px; }
.shape-row{ display:flex; justify-content:space-between; gap:8px; font-family:var(--mono); font-size:0.82rem; border-top:1px dashed var(--rule-line); padding-top:6px; }
.shape-row .srk{ color:var(--chalk-dim); flex-shrink:0; }
.shape-row .srv{ color:var(--chalk-white); text-align:right; }

/* flashcards */
.flashcards-wrap{ margin:44px 0 10px; }
.fc-heading{ font-family:var(--serif-display); font-size:1.7rem; color:var(--chalk-white); margin:0 0 4px; display:flex; align-items:center; gap:10px; }
.flip-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; margin-top:16px; }
.flip-card{ perspective:1300px; height:160px; cursor:pointer; }
.flip-card-inner{
  position:relative; width:100%; height:100%;
  transition:transform 0.65s cubic-bezier(.22,.85,.3,1.1);
  transform-style:preserve-3d;
}
.flip-card.flipped .flip-card-inner{ transform:rotateY(180deg); }
.flip-face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:14px; padding:20px 18px; display:flex; align-items:center; justify-content:center;
  text-align:center; font-size:0.95rem; line-height:1.45;
}
.flip-front{
  background:linear-gradient(160deg, rgba(126,200,255,0.09), rgba(255,255,255,0.02));
  border:1px solid rgba(126,200,255,0.3); color:var(--chalk-white); font-family:var(--sans); font-weight:500;
}
.flip-back{
  background:linear-gradient(160deg, rgba(255,207,86,0.18), rgba(255,207,86,0.05));
  border:1px solid rgba(255,207,86,0.45); color:var(--chalk-yellow);
  transform:rotateY(180deg); font-family:var(--mono); font-weight:600;
}
.flip-hint{ position:absolute; bottom:8px; right:12px; font-size:0.6rem; opacity:0.45; font-family:var(--mono); font-weight:400; }
.flip-card:hover .flip-front{ border-color: var(--chalk-blue); box-shadow: 0 10px 24px -10px rgba(0,0,0,0.5); }
.flip-card:hover .flip-back{ border-color: var(--chalk-yellow); box-shadow: 0 10px 24px -10px rgba(0,0,0,0.5); }

/* chapter prev/next footer */
.chapter-pager{
  display:flex; justify-content:space-between; gap:14px; max-width:900px; margin:40px auto 0; padding:0 6vw;
  flex-wrap:wrap;
}
.pager-btn{
  flex:1; min-width:150px; cursor:pointer; padding:16px 18px; border-radius:12px;
  background:rgba(255,255,255,0.03); border:1px solid var(--rule-line);
  transition:all 0.3s; font-family:var(--sans);
}
.pager-btn:hover{ border-color:var(--chalk-yellow); background:rgba(255,207,86,0.06); transform:translateY(-2px); }
.pager-btn .plabel{ font-family:var(--mono); font-size:0.65rem; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:1px; }
.pager-btn .ptitle{ font-family:var(--serif-display); font-size:1.15rem; color:var(--chalk-white); margin-top:4px; }
.pager-btn.next{ text-align:right; }

/* mascot */
.mascot{ width:150px; height:150px; }
.mascot-float{ position:fixed; bottom:22px; right:22px; width:64px; height:64px; z-index:15; opacity:0.9; cursor:pointer; transition:transform 0.3s; filter:drop-shadow(0 6px 14px rgba(0,0,0,0.5)); }
.mascot-float:hover{ transform:scale(1.12) rotate(-4deg); }
@media (max-width:700px){ .mascot-float{ width:48px; height:48px; bottom:14px; right:14px; } }

.magnifier{ transform-origin:70% 70%; animation:magSwing 3.2s ease-in-out infinite; }
@keyframes magSwing{ 0%,100%{ transform:rotate(-6deg);} 50%{ transform:rotate(8deg);} }
.blink{ animation:blinkEye 4.5s infinite; transform-origin:center; }
@keyframes blinkEye{ 0%,92%,100%{ transform:scaleY(1);} 95%{ transform:scaleY(0.1);} }
.bob{ animation:bobY 3.6s ease-in-out infinite; }
@keyframes bobY{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }

/* scrollbar */
::-webkit-scrollbar{ width:10px; }
::-webkit-scrollbar-track{ background:var(--board-0); }
::-webkit-scrollbar-thumb{ background:var(--wood); border-radius:10px; }

.reveal-io{ opacity:0; transform:translateY(18px); transition:opacity 0.7s ease, transform 0.7s ease; }
.reveal-io.in{ opacity:1; transform:translateY(0); }

@media (max-width:600px){
  .topnav{ padding:12px 16px; }
  .toc-wrap{ padding:16px 5vw 70px; }
  .chapter-body{ padding:6px 5vw 80px; }
}
</style>
</head>
<body>

<div class="board-texture"></div>
<div class="frame-edge"></div>
<div id="symbolField"></div>
<div id="progressBar"></div>

<div id="app">

  <nav class="topnav">
    <div class="brand" onclick="goHome()">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><path d="M6 6L24 24M24 6L6 24" stroke="#ffcf56" stroke-width="3.4" stroke-linecap="round"/></svg>
      find <span class="x-mark">X</span>
    </div>
    <div class="nav-actions">

        "Number of zeros of a polynomial ≤ its degree. A quadratic has at most 2 zeros, a cubic at most 3.",
        "A polynomial with all coefficients zero except the constant term (degree 0, e.g. p(x)=5) is a <b>constant polynomial</b> — it has no zero unless the constant itself is 0."
      ]},
    {type:'concept', heading:"Reading the Graph",
      items:[
        "<b>Linear polynomial</b> graph → a straight line, exactly 1 zero.",
        "<b>Quadratic polynomial</b> graph → a <b>parabola</b>. If it opens upward (a &gt; 0) or downward (a &lt; 0), it can cross the x-axis at 0, 1 (touching), or 2 points — matching 0, 1, or 2 real zeros.",
        "<b>Cubic polynomial</b> graph → an S-shaped curve, crossing the x-axis at up to 3 points.",
        "<b>Counting zeros from a graph</b> is a standalone skill CBSE tests directly — just count how many times the curve meets the x-axis; a curve that only touches (doesn't cross) still counts as one zero, but a repeated (double) one."
      ]},
    {type:'theorem', heading:"Relationship Between Zeros and Coefficients",
      items:[
        "<b>Quadratic</b> p(x) = ax² + bx + c with zeros α, β: <span class='mathf'>α + β = −b/a</span> and <span class='mathf'>αβ = c/a</span>.",
        "<b>Cubic</b> p(x) = ax³ + bx² + cx + d with zeros α, β, γ: <span class='mathf'>α+β+γ = −b/a</span>, <span class='mathf'>αβ+βγ+γα = c/a</span>, <span class='mathf'>αβγ = −d/a</span>.",
        "Reverse skill (very testable): given the sum and product of zeros, you can <b>build</b> the quadratic: <span class='mathf'>x² − (sum)x + (product)</span>.",
        "Useful derived identities worth memorising for 'find α²+β²' type questions: <span class='mathf'>α²+β² = (α+β)² − 2αβ</span>, and <span class='mathf'>(α−β)² = (α+β)² − 4αβ</span>."
      ]},
    {type:'concept', heading:"Division Algorithm for Polynomials",
      items:[
        "For polynomials p(x) and g(x) with g(x) ≠ 0: <span class='mathf'>p(x) = g(x) × q(x) + r(x)</span>, where r(x) = 0 or degree of r(x) &lt; degree of g(x).",
        "This mirrors Euclid's division lemma from Chapter 1, but for algebraic expressions instead of integers.",
        "Used to verify given zeros, or to find all zeros of a cubic when one or two are already known — divide out the known factors first.",
        "Step-by-step approach for 'find all zeros of the cubic given two of its zeros': form the quadratic factor from the two known zeros (using sum/product), divide the cubic by that quadratic factor, and the quotient gives the remaining zero(s)."
      ]},
    {type:'extra', items:[
        "The word 'polynomial' comes from Greek/Latin roots meaning 'many terms' (poly = many, nomen = name/term). A one-term expression is a <b>monomial</b>, two terms a <b>binomial</b>, three terms a <b>trinomial</b>.",
        "The relationship between zeros and coefficients generalises far beyond Class 10 — for a degree-n polynomial, these are called <b>Vieta's Formulas</b>, named after the 16th-century French mathematician François Viète, and they're used heavily in higher algebra and even in cryptographic algorithms.",
        "Every polynomial curve you graph is continuous and smooth (no breaks, no sharp corners) — this is exactly why root-finding software (like the ones inside calculators and engineering tools) can reliably zoom in on a zero once it detects a sign change."
      ]},
    {type:'facts', items:[
        "There is <b>no general formula using only radicals</b> (like the quadratic formula) for solving polynomial equations of degree 5 or higher — this was proven independently by mathematicians Niels Abel and Évariste Galois in the early 1800s, one of the most celebrated results in algebra.",
        "Computer graphics, from smartphone fonts to video-game character models, are drawn using polynomial curves called <b>Bézier curves</b> — built on the exact same 'roots and coefficients' logic explored in this chapter.",
        "Ancient Babylonian and Egyptian scribes were already solving polynomial-style word problems nearly 4000 years ago, using geometric methods rather than the symbolic algebra we use today — symbolic notation (x², x³) is a comparatively recent invention.",
        "'Splitting the middle term' — the factorisation trick every student learns — is a specific case of a general technique mathematicians call completing a polynomial's factor structure, used everywhere from cryptography to signal processing."
      ]},
    {type:'trick', items:[
        "For splitting the middle term in a quadratic ax²+bx+c, find two numbers whose <b>product is a×c</b> and whose <b>sum is b</b> — this two-second mental check saves guesswork.",
        "If a question gives you 'sum of zeros = 0', it's hinting the quadratic has no x-term (of the form ax²+c) — a common shortcut in MCQs.",
        "When asked to verify the relationship between zeros and coefficients, always compute α+β and αβ from the actual roots first, then separately compute −b/a and c/a, and show both match — examiners give marks for showing both sides explicitly."
      ]}
  ],
  formulas:[
    ["Quadratic: sum of zeros","α + β = −b/a"],
    ["Quadratic: product of zeros","αβ = c/a"],
    ["Build quadratic from zeros","x² − (α+β)x + αβ"],
    ["Cubic: sum of zeros","α+β+γ = −b/a"],
    ["Cubic: sum of products (pairs)","αβ+βγ+γα = c/a"],

    ["Zero of a linear polynomial ax+b","x = −b/a"]

  flashcards:[

{
  id:3, title:"Pair of Linear Equations in Two Variables", icon:"linear2v", color:"#ffcf56",
  tagline:"Two lines, one plane — three possible love stories: they meet once, never, or are the same line forever.",
  sections:[
    {type:'concept', heading:"Forms & Graphical Meaning",
      items:[
        "General form: <span class='mathf'>a₁x + b₁y + c₁ = 0</span> and <span class='mathf'>a₂x + b₂y + c₂ = 0</span>.",
        "Each equation represents a straight line. A <b>solution</b> to the pair is the point where both lines meet.",
        "Graphically there are exactly three possibilities — this is the single most important idea of the chapter.",
        "A pair of linear equations is called a <b>linear system</b>; solving it 'graphically' just means plotting both lines accurately (using at least two points each) and reading off the intersection."
      ]},
    {type:'theorem', heading:"The Consistency Conditions",
      items:[
        "<b>Unique solution (intersecting lines):</b> <span class='mathf'>a₁/a₂ ≠ b₁/b₂</span> — consistent, independent.",
        "<b>Infinite solutions (coincident lines):</b> <span class='mathf'>a₁/a₂ = b₁/b₂ = c₁/c₂</span> — consistent, dependent.",
        "<b>No solution (parallel lines):</b> <span class='mathf'>a₁/a₂ = b₁/b₂ ≠ c₁/c₂</span> — inconsistent.",
        "Memory anchor: if the first two ratios are unequal, the lines <i>must</i> cross somewhere; if all three ratios are equal, the two equations are secretly the same line scaled by a constant."
      ]},
    {type:'concept', heading:"Algebraic Solution Methods",
      items:[
        "<b>Substitution method:</b> express one variable in terms of the other from one equation, substitute into the second. Best when one equation already has a variable with coefficient 1.",
        "<b>Elimination method:</b> multiply equations so a variable's coefficients match, then add/subtract to eliminate it. Best for symmetric-looking equations.",
        "<b>Cross-multiplication method:</b> a direct formula-based shortcut — powerful once memorised, saves time in long word problems, especially when substitution would create messy fractions.",
        "For word problems: always define variables clearly first (e.g. let present age = x), form two equations from the two given conditions, then solve. Common families: ages, fraction (numerator/denominator swaps), speed–distance–time (boats & streams), and cost-of-items problems."
      ]},
    {type:'theorem', heading:"Equations Reducible to a Pair of Linear Equations",
      items:[
        "Some equations look non-linear (e.g. containing 1/x, 1/y) but become linear after a clever <b>substitution</b> — commonly u = 1/x and v = 1/y.",
        "After substituting, solve the resulting pair of linear equations in u and v normally, then convert back: <span class='mathf'>x = 1/u</span>, <span class='mathf'>y = 1/v</span>.",
        "This 'substitute to linearise' idea reappears constantly in higher mathematics — it's the earliest example students see of transforming a hard problem into a familiar one."
      ]},
    {type:'extra', items:[
        "Systems of linear equations are the backbone of <b>GPS positioning</b> — your phone solves several simultaneous equations (from distances to different satellites) to pin down your exact location.",
        "Large real-world systems can have hundreds or millions of variables — economists, engineers, and computer graphics programs solve these using matrix methods that are a direct extension of the elimination method you're learning here.",
        "The word 'linear' refers to the fact that every term is degree 1 — no x², no xy, no √x. The moment any term breaks that rule, the graph stops being a straight line."
      ]},
    {type:'facts', items:[
        "Your phone's <b>GPS</b> works by solving a system of equations using signal-timing data from multiple satellites simultaneously — a direct, real-time, real-world version of the 'pair of equations' idea, just scaled up to more variables.",
        "The three graphical outcomes you learn here — intersecting, parallel, coincident — map almost exactly onto three classic outcomes in economics: a market finding one equilibrium price, a permanent shortage/surplus, or two policies that are secretly identical.",
        "Substitution and elimination, the two hand-methods taught in school, are the direct ancestors of <b>Gaussian elimination</b> — the algorithm computers still use today to solve systems with millions of variables in engineering and machine learning.",
        "Large-scale flight schedules, factory production planning, and delivery-route optimisation are all solved using giant systems of linear equations and inequalities, a field called <b>linear programming</b> that grew directly out of this humble two-variable chapter."
      ]},
    {type:'trick', items:[
        "Before choosing a method, glance at the coefficients — if any variable already has coefficient 1 in either equation, substitution will be faster than elimination.",
        "In word problems, always double-check units before forming equations (e.g. convert 'km/h' consistently) — most marks lost in this chapter are due to equation-formation errors, not solving errors.",
        "If a question only asks you to check consistency (not actually solve), don't fully solve the system — just compare the three ratios a₁/a₂, b₁/b₂, c₁/c₂ directly and save time."
      ]}
  ],
  formulas:[
    ["Unique solution condition","a₁/a₂ ≠ b₁/b₂"],
    ["Infinite solutions condition","a₁/a₂ = b₁/b₂ = c₁/c₂"],
    ["No solution condition","a₁/a₂ = b₁/b₂ ≠ c₁/c₂"],
    ["Cross-multiplication","x/(b₁c₂−b₂c₁) = y/(c₁a₂−c₂a₁) = 1/(a₁b₂−a₂b₁)"],
    ["Substitution for 1/x, 1/y type","u = 1/x, v = 1/y, then solve linearly"],
    ["Slope of a₁x+b₁y+c₁=0","m = −a₁/b₁"],
    ["y-intercept of a line","c = −c₁/b₁ (from a₁x+b₁y+c₁=0)"],
    ["Speed–distance–time relation","distance = speed × time"],
    ["Combined work rate (two workers)","1/T = 1/T₁ + 1/T₂"],
    ["Boats & streams: downstream speed","speed of boat + speed of stream"],
    ["Boats & streams: upstream speed","speed of boat − speed of stream"]
  ],
  flashcards:[
    {q:"Condition for a unique solution?", a:"a₁/a₂ ≠ b₁/b₂"},
    {q:"Condition for infinitely many solutions?", a:"a₁/a₂ = b₁/b₂ = c₁/c₂"},
    {q:"Condition for no solution?", a:"a₁/a₂ = b₁/b₂ ≠ c₁/c₂"},
    {q:"Name the three algebraic methods for solving a linear pair.", a:"Substitution, Elimination, Cross-multiplication"},
    {q:"Graphically, what do parallel lines represent?", a:"No solution (inconsistent pair)"},
    {q:"Graphically, what do coincident lines represent?", a:"Infinitely many solutions"},
    {q:"What substitution linearises equations with 1/x and 1/y?", a:"u = 1/x, v = 1/y"},
    {q:"What do we call a pair of equations with no solution?", a:"Inconsistent"}
  ]
},
{
  id:4, title:"Quadratic Equations", icon:"quadratic", color:"#ff7a6b",
  tagline:"The parabola's algebra — solve for x when a curve decides to touch, cross, or completely avoid the x-axis.",
  sections:[
    {type:'concept', heading:"Standard Form & Roots",
      items:[
        "Standard form: <span class='mathf'>ax² + bx + c = 0</span>, a ≠ 0.",
        "A real number α is a <b>root</b> if aα² + bα + c = 0 — equivalently, x = α is a zero of the corresponding polynomial from Chapter 2.",
        "A quadratic equation has at most 2 real roots.",
        "Recognising a quadratic in disguise is a skill in itself — expressions like (x+1)(x−2) = x² − 5, or equations involving x and 1/x, often simplify down to the standard ax²+bx+c=0 form after expansion."
      ]},
    {type:'concept', heading:"Solving Methods",
      items:[
        "<b>Factorisation:</b> split the middle term so the quadratic breaks into two linear factors, then set each to zero.",
        "<b>Completing the square:</b> rewrite ax² + bx + c as a perfect square plus a constant — this is literally where the quadratic formula comes from, and CBSE sometimes asks you to solve 'by completing the square' explicitly.",
        "<b>Quadratic formula:</b> <span class='mathf'>x = [−b ± √(b² − 4ac)] / 2a</span> — works for every quadratic, always your fallback when factorisation isn't obvious.",
        "Worked outline for completing the square: divide throughout by a, move the constant to the other side, add (half the x-coefficient)² to both sides to form a perfect square trinomial, then take the square root of both sides."
      ]},
    {type:'theorem', heading:"The Discriminant — Nature of Roots",
      items:[
        "Discriminant <span class='mathf'>D = b² − 4ac</span> decides everything about the roots without solving the equation.",
        "<b>D &gt; 0</b> → two distinct real roots (parabola cuts the x-axis at 2 points).",
        "<b>D = 0</b> → two equal real roots (parabola just touches the x-axis — this is the vertex).",
        "<b>D &lt; 0</b> → no real roots (parabola never meets the x-axis).",
        "This single computation is a favourite 1-mark and 2-mark question: 'find the value of k for which the equation has equal roots' simply means setting D = 0 and solving for k."
      ]},
    {type:'concept', heading:"Applications & Word Problems",
      items:[
        "Typical CBSE word-problem families: consecutive numbers, ages, speed–distance–time with a changed speed/time condition, area/perimeter of rectangles, and work-and-time (pipes filling a tank).",
        "Workflow: define the variable clearly, translate the word condition into a quadratic equation, solve using the formula or factorisation, and — crucially — <b>reject any root that doesn't make physical sense</b> (like a negative length, age, or time)."
      ]},
    {type:'extra', items:[
        "Parabolic reflectors — used in satellite dishes, car headlights, and telescope mirrors — are precisely the 3D graph of a quadratic equation, shaped so every incoming signal focuses onto a single point.",
        "'Completing the square,' the method behind the quadratic formula, is also the key algebraic trick used to derive the equation of a circle and to locate the vertex of any parabola in coordinate geometry.",
        "Clay tablets from ancient Babylon, nearly 4000 years old, already contain step-by-step methods for solving quadratic-like problems — making this one of the oldest continuously studied topics in all of mathematics."
      ]},
    {type:'facts', items:[
        "The discriminant's sign (D&gt;0, D=0, D&lt;0) is the exact same logic physicists use to determine whether a thrown ball ever reaches a certain height, or whether two moving objects ever meet — 'does a real solution exist' is a universal question, not just an exam trick.",
        "The word 'quadratic' comes from the Latin <i>quadratus</i>, meaning 'square' — because the original geometric problems these equations solved were literally about finding the side of a square of a given area.",
        "Video game physics engines solve a quadratic equation (from the laws of projectile motion) every single frame to calculate exactly where a thrown or launched object will land.",
        "Long before the 'minus b' formula was taught in classrooms, 9th-century Persian mathematician <b>Al-Khwarizmi</b> — whose name gives us the word 'algorithm' — wrote systematic rules for solving quadratic-type equations using geometric reasoning."
      ]},
    {type:'trick', items:[
        "If a quadratic equation has rational coefficients and one irrational root of the form p+√q, the other root is always its conjugate p−√q — a shortcut that saves solving the whole equation again.",
        "For 'nature of roots' questions, compute only the discriminant D — you almost never need to find the actual roots unless the question specifically asks for them.",
        "When a word problem produces two valid-looking roots, always re-read the question for hidden constraints (positive only, whole numbers only, greater than a certain value) before picking the final answer."
      ]}
  ],

{
  id:5, title:"Arithmetic Progressions", icon:"ap", color:"#c9a6ff",
  tagline:"Patterns that add the same step every time — ladders, salaries, seating rows, and Gauss's famous shortcut.",
  sections:[
    {type:'concept', heading:"What Makes a Sequence an AP",
      items:[
        "An <b>Arithmetic Progression</b> is a list of numbers where each term (after the first) is obtained by adding a fixed number, the <b>common difference (d)</b>, to the previous term.",
        "<span class='mathf'>d = a₂ − a₁ = a₃ − a₂ = ...</span> — if this difference isn't constant, it's not an AP.",
        "First term is denoted <span class='mathf'>a</span> (or a₁). d can be positive (increasing AP), negative (decreasing AP), or zero (constant AP)."
      ]},
    {type:'theorem', heading:"Core Formulas",
      items:[
        "<b>nth term:</b> <span class='mathf'>aₙ = a + (n−1)d</span> — lets you jump directly to any term without listing all previous ones.",
        "<b>Sum of first n terms:</b> <span class='mathf'>Sₙ = n/2 [2a + (n−1)d]</span>, also written as <span class='mathf'>Sₙ = n/2 [a + l]</span> where l is the last term.",
        "<b>nth term from Sₙ:</b> <span class='mathf'>aₙ = Sₙ − Sₙ₋₁</span> — very handy when a question gives only the sum formula."
      ]},
    {type:'extra', items:[
        "The sum formula is essentially <b>Gauss's trick</b> — as a schoolboy, Carl Friedrich Gauss allegedly summed 1 to 100 instantly by pairing the first and last term (1+100, 2+99, ...) — exactly the logic behind Sₙ = n/2[a+l].",
        "AP shows up constantly outside exams: simple interest growth, stadium seating rows, straight-line depreciation of assets, and even the spacing of rungs on a ladder.",
        "An AP with common difference 0 is technically still an AP (a constant sequence) — don't assume d must be non-zero when a question says 'the numbers are in AP'."
      ]},
    {type:'facts', items:[
        "Gauss's schoolboy shortcut for summing 1 to 100 is considered one of the earliest recorded examples of finding a mathematical <i>shortcut</i> instead of brute-force calculating — a mindset that underlies almost all modern algorithm design.",
        "Amphitheatre and stadium seating is frequently designed as an AP — each row holding a fixed number of seats more than the last as it radiates outward — which is exactly why 'total seats in a stadium' is a classic AP word problem.",
        "Straight-line depreciation, a common accounting method where an asset loses the same fixed value every year, is literally an arithmetic progression running in reverse (a decreasing AP) on a company's balance sheet.",
        "The 'sum of an AP' formula is a special, simplest case of a much broader mathematical field called <b>series and sequences</b>, which underlies compound interest, population growth models, and the loop-counting logic inside every computer program."
      ]},
    {type:'trick', items:[
        "If three numbers are in AP, represent them as <span class='mathf'>a−d, a, a+d</span> — the middle term is automatically their average, and this trick massively simplifies algebra.",
        "For 'which term is the first negative term' type questions, set <span class='mathf'>aₙ &lt; 0</span> and solve the inequality for n, then round up to the next integer.",
        "For four numbers in AP, use <span class='mathf'>a−3d, a−d, a+d, a+3d</span> (common difference 2d between consecutive terms) — this symmetric trick avoids messy fractions."
      ]}
  ],
  formulas:[
    ["nth term","aₙ = a + (n−1)d"],
    ["Sum of n terms","Sₙ = n/2[2a + (n−1)d]"],
    ["Sum (using last term)","Sₙ = n/2[a + l]"],
    ["nth term from sums","aₙ = Sₙ − Sₙ₋₁"],
    ["Three terms in AP","a−d, a, a+d"],
    ["Four terms in AP","a−3d, a−d, a+d, a+3d"],
    ["Common difference","d = aₙ − aₙ₋₁"],
    ["Sum of first n natural numbers","n(n+1)/2"],
    ["Sum of first n odd numbers","n²"],
    ["Sum of first n even numbers","n(n+1)"],
    ["Arithmetic mean of two numbers a, b","(a+b)/2"],
    ["nth term from the end (last term l)","l − (n−1)d"]
  ],
  flashcards:[
    {q:"Formula for the nth term of an AP?", a:"aₙ = a + (n−1)d"},
    {q:"Formula for the sum of the first n terms?", a:"Sₙ = n/2[2a+(n−1)d]"},
    {q:"How do you find the common difference d?", a:"d = aₙ − aₙ₋₁"},
    {q:"If a, b, c are in AP, what is b in terms of a and c?", a:"b = (a+c)/2"},
    {q:"How do you find the nth term from sums?", a:"aₙ = Sₙ − Sₙ₋₁"},
    {q:"Represent three numbers in AP using one variable.", a:"a−d, a, a+d"},
    {q:"Sum of the first n natural numbers?", a:"n(n+1)/2"},
    {q:"Who is credited with the fast summing trick for 1 to 100?", a:"Carl Friedrich Gauss"}
  ]
},
{
  id:6, title:"Triangles", icon:"triangles", color:"#7ec8ff",
  tagline:"Same shape, different size — the geometry of similarity that underpins maps, shadows, and camera lenses.",
  sections:[
    {type:'concept', heading:"Similar Figures vs Congruent Figures",
      items:[
        "<b>Congruent</b> figures are identical in shape AND size. <b>Similar</b> figures have the <b>same shape but not necessarily the same size</b> — corresponding angles equal, corresponding sides proportional.",
        "All congruent figures are similar, but similar figures need not be congruent."
      ]},
    {type:'theorem', heading:"The Basic Proportionality Theorem (Thales)",
      items:[
        "<b>BPT / Thales' Theorem:</b> If a line is drawn parallel to one side of a triangle intersecting the other two sides at distinct points, the other two sides are divided in the <b>same ratio</b>.",
        "<b>Converse of BPT:</b> if a line divides two sides of a triangle in the same ratio, it is parallel to the third side.",
        "These two together are the most heavily tested proof-based results in this chapter."
      ]},
    {type:'theorem', heading:"Similarity Criteria for Triangles",
      items:[
        "<b>AAA:</b> if corresponding angles of two triangles are equal, the triangles are similar (in fact AA is enough — the third angle is automatically equal).",
        "<b>SSS:</b> if corresponding sides of two triangles are in the same ratio, the triangles are similar.",
        "<b>SAS:</b> if one pair of corresponding sides is proportional and the included angles are equal, the triangles are similar."
      ]},
    {type:'theorem', heading:"Areas of Similar Triangles & Pythagoras",
      items:[
        "<b>Area ratio theorem:</b> the ratio of areas of two similar triangles equals the <b>square</b> of the ratio of their corresponding sides.",
        "<b>Pythagoras Theorem:</b> in a right triangle, the square of the hypotenuse equals the sum of the squares of the other two sides — provable directly using similar triangles formed by the altitude to the hypotenuse.",
        "<b>Converse of Pythagoras:</b> if the square of one side of a triangle equals the sum of squares of the other two, the angle opposite the first side is a right angle."
      ]},
    {type:'extra', items:[
        "Similar triangles are the mathematical reason a <b>pinhole camera</b> and your eye's lens can project a scaled image of the real world onto a small surface — the object, the lens, and the image form similar triangles.",
        "Surveyors historically measured the height of mountains and pyramids using shadows and similar triangles, centuries before laser rangefinders existed — this is the exact 'height and distance' logic reused in Chapter 9.",
        "Pythagoras theorem has over 350 known distinct proofs, including one published by future U.S. President <b>James Garfield</b> in 1876, using nothing but a trapezium built from two copies of the same right triangle."
      ]},
    {type:'facts', items:[
        "James Garfield discovered his original trapezium-based proof of Pythagoras' theorem five years <i>before</i> becoming U.S. President, during an informal mathematical conversation with fellow members of Congress in 1876 — he remains the only U.S. President credited with a genuine original mathematical result.",
        "The word 'similar' comes from the Latin <i>similis</i>, meaning 'like' or 'resembling' — the same root that gives English the words 'simulate' and 'simultaneous.'",
        "Bridge and roof trusses are built almost entirely from triangles, never squares or rectangles, because a triangle is the only polygon that can't be deformed without changing the length of one of its sides — making it the most structurally rigid shape possible.",
        "Fractal art like the Sierpinski Triangle is built by endlessly nesting smaller similar triangles inside a larger one — a striking, modern visual descendant of the similarity ideas explored in this chapter."
      ]},
    {type:'trick', items:[
        "When a question shows a triangle with a line parallel to one side, immediately check if it's a BPT (ratio) question or a similar-triangles (AA) question — look for whether you need a ratio of segments or a ratio of full sides.",
        "Common Pythagorean triples worth memorising to save calculation time: <span class='mathf'>(3,4,5)</span>, <span class='mathf'>(5,12,13)</span>, <span class='mathf'>(8,15,17)</span>, <span class='mathf'>(7,24,25)</span> — and their multiples (6,8,10 etc).",
        "For 'ratio of areas' questions, never compute both areas separately if you already know the ratio of corresponding sides — just square that ratio directly."
      ]}

{
  id:7, title:"Coordinate Geometry", icon:"coord", color:"#5fd9c7",
  tagline:"Algebra meets the graph paper — pin down any point, distance, or ratio using nothing but two numbers.",
  sections:[
    {type:'concept', heading:"The Coordinate Plane Refresher",
      items:[
        "Any point in a plane is uniquely located by an ordered pair <span class='mathf'>(x, y)</span> relative to two perpendicular axes — the x-axis (horizontal) and y-axis (vertical), meeting at the <b>origin (0,0)</b>.",
        "This chapter is really 'algebra applied to geometry' — every geometric idea (distance, midpoint, ratio, collinearity, area) gets a clean formula, so you rarely need to actually draw an accurate graph to solve a problem.",
        "The plane is divided into 4 <b>quadrants</b>: signs of (x,y) go (+,+), (−,+), (−,−), (+,−) going anticlockwise from the top-right."
      ]},
    {type:'theorem', heading:"Distance & Section Formulas",
      items:[
        "<b>Distance formula:</b> distance between A(x₁,y₁) and B(x₂,y₂) is <span class='mathf'>√[(x₂−x₁)² + (y₂−y₁)²]</span> — a direct application of Pythagoras theorem, treating the horizontal and vertical gaps as the two legs of a right triangle.",
        "<b>Section formula:</b> the point P dividing segment AB internally in ratio m:n has coordinates <span class='mathf'>[(mx₂+nx₁)/(m+n), (my₂+ny₁)/(m+n)]</span>.",
        "<b>Midpoint formula</b> is just the section formula with ratio 1:1 → <span class='mathf'>[(x₁+x₂)/2, (y₁+y₂)/2]</span>.",
        "<b>Points of trisection:</b> to divide a segment into three equal parts, apply the section formula twice, once with ratio 1:2 and once with ratio 2:1."
      ]},
    {type:'concept', heading:"Area of a Triangle",
      items:[
        "Area of triangle with vertices (x₁,y₁), (x₂,y₂), (x₃,y₃): <span class='mathf'>½ |x₁(y₂−y₃) + x₂(y₃−y₁) + x₃(y₁−y₂)|</span>.",
        "If the computed area is 0, the three points are <b>collinear</b> (they lie on a single straight line) — a frequently tested condition.",
        "The same formula extends to quadrilaterals by splitting them into two triangles using a diagonal, then adding the two areas."
      ]},
    {type:'theorem', heading:"Using the Formulas Together",
      items:[
        "<b>Finding the centroid</b> of a triangle (the point where medians meet) with vertices (x₁,y₁),(x₂,y₂),(x₃,y₃): <span class='mathf'>[(x₁+x₂+x₃)/3, (y₁+y₂+y₃)/3]</span> — a direct extension of the midpoint idea.",
        "<b>Proving a shape is a specific quadrilateral</b> (square, rectangle, rhombus, parallelogram) combines multiple tools: use the distance formula to check side lengths, and check diagonals for equality (rectangle/square) or perpendicular bisection (rhombus/square).",
        "<b>Ratio in which the x-axis or y-axis divides a segment</b> is a specific section-formula application: for the x-axis, set the y-coordinate of the dividing point to 0 and solve for the ratio k:1."
      ]},
    {type:'extra', items:[
        "René Descartes, who invented the (x,y) coordinate system in the 17th century, reportedly got the idea while lying ill in bed watching a fly move across the corner of his ceiling — realising its position could be pinned down using just two numbers relative to the walls.",
        "Every video game character's position, every pixel on your screen, and every GPS coordinate on Earth (latitude, longitude) is fundamentally the same idea taught in this chapter — a point located precisely by two (or three) numbers.",
        "Computer-Aided Design (CAD) software, used to design everything from smartphones to aircraft, relies on distance and section formulas exactly like the ones here to calculate precise positions in a virtual 3D space."
      ]},
    {type:'facts', items:[
        "The area-of-triangle-from-coordinates formula is nicknamed the <b>'shoelace formula'</b> — when you write the coordinates in a column and multiply diagonally, the crossing lines resemble lacing up a shoe.",
        "Cartography (mapmaking) is essentially applied coordinate geometry at planetary scale — every point on a map is stored as a coordinate pair, and distances between cities are calculated using a curved-surface version of the distance formula.",
        "Coordinate geometry was historically revolutionary because it merged two previously separate branches of mathematics — algebra and geometry — into one unified system, a shift so significant it's sometimes called the birth of 'analytic geometry.'",
        "Robotic arms in factories are positioned using coordinate geometry in three dimensions — each joint's movement is calculated so the arm's tip lands on an exact (x,y,z) coordinate to weld, place, or assemble a part."
      ]},
    {type:'trick', items:[
        "When a question only asks whether points are collinear (not the actual area), you can stop as soon as you get Area = 0 — no need to simplify further or find any missing coordinate beyond what's asked.",
        "For 'type of quadrilateral' questions, check diagonals first (equal → could be rectangle/square, perpendicular → could be rhombus/square) before computing all four side lengths — it's often faster to disprove a shape than to fully prove it.",
        "If a problem gives you three vertices of a parallelogram and asks for the fourth, use the property that diagonals of a parallelogram bisect each other — set the midpoint of one diagonal equal to the midpoint of the other and solve directly, without needing the section formula at all."
      ]}
  ],
  formulas:[
    ["Distance formula","√[(x₂−x₁)² + (y₂−y₁)²]"],
    ["Distance from origin","√(x² + y²)"],
    ["Section formula","[(mx₂+nx₁)/(m+n), (my₂+ny₁)/(m+n)]"],
    ["Midpoint formula","[(x₁+x₂)/2, (y₁+y₂)/2]"],
    ["Centroid of a triangle","[(x₁+x₂+x₃)/3, (y₁+y₂+y₃)/3]"],
    ["Area of triangle","½|x₁(y₂−y₃)+x₂(y₃−y₁)+x₃(y₁−y₂)|"],
    ["Collinearity condition","Area = 0"],
    ["Ratio in which x-axis divides AB","k = −y₁/y₂"],
    ["Slope of a line through two points","m = (y₂−y₁)/(x₂−x₁)"],
    ["Condition for perpendicular lines","m₁ × m₂ = −1"],
    ["Condition for parallel lines","m₁ = m₂"],
    ["Area of a quadrilateral (via diagonal split)","Area(Δ₁) + Area(Δ₂)"]
  ],
  flashcards:[
    {q:"Distance formula between two points?", a:"√[(x₂−x₁)² + (y₂−y₁)²]"},
    {q:"Midpoint formula?", a:"[(x₁+x₂)/2, (y₁+y₂)/2]"},
    {q:"Section formula for ratio m:n?", a:"[(mx₂+nx₁)/(m+n), (my₂+ny₁)/(m+n)]"},
    {q:"Condition for three points to be collinear?", a:"Area of the triangle they form = 0"},
    {q:"Centroid formula of a triangle?", a:"[(x₁+x₂+x₃)/3, (y₁+y₂+y₃)/3]"},
    {q:"Who is credited with inventing the (x,y) coordinate plane?", a:"René Descartes"},
    {q:"What is the area-of-triangle formula nicknamed?", a:"The 'shoelace formula'"},
    {q:"Distance of a point (x,y) from the origin?", a:"√(x² + y²)"}
  ]
},
{
  id:8, title:"Introduction to Trigonometry", icon:"trig", color:"#ffcf56",
  tagline:"The three-way relationship between a right triangle's angle and the ratio of its sides.",
  sections:[
    {type:'concept', heading:"Trigonometric Ratios",
      items:[
        "For a right triangle with an acute angle θ: <span class='mathf'>sin θ = opposite/hypotenuse</span>, <span class='mathf'>cos θ = adjacent/hypotenuse</span>, <span class='mathf'>tan θ = opposite/adjacent</span>.",
        "Reciprocal ratios: <span class='mathf'>cosec θ = 1/sin θ</span>, <span class='mathf'>sec θ = 1/cos θ</span>, <span class='mathf'>cot θ = 1/tan θ</span>.",
        "Core relation: <span class='mathf'>tan θ = sin θ / cos θ</span> and <span class='mathf'>cot θ = cos θ / sin θ</span>.",
        "The ratios depend only on the <b>angle</b>, never on the actual size of the triangle — this is exactly why similar right triangles (Chapter 6) all share the same trig ratios for a given angle."
      ]},
    {type:'table', heading:"Standard Angle Values (0° to 90°)",
      intro:"The single most-used reference table in this chapter — memorise it cold, it's used in almost every problem here and in Chapter 9.",
      headers:["Ratio","0°","30°","45°","60°","90°"],
      rows:[
        ["sin θ","0","1/2","1/√2","√3/2","1"],
        ["cos θ","1","√3/2","1/√2","1/2","0"],
        ["tan θ","0","1/√3","1","√3","not defined"],
        ["cosec θ","not defined","2","√2","2/√3","1"],
        ["sec θ","1","2/√3","√2","2","not defined"],
        ["cot θ","not defined","√3","1","1/√3","0"]
      ]},
    {type:'concept', heading:"Reading the Table Instantly",
      items:[
        "Pattern trick: sin values at 0°,30°,45°,60°,90° are <span class='mathf'>√0/2, √1/2, √2/2, √3/2, √4/2</span> — cos is exactly the same list, reversed.",
        "tan θ is simply sin θ ÷ cos θ at each angle — you can rebuild the whole tan row from the sin and cos rows if you forget it.",
        "cosec, sec, and cot are just the reciprocals of sin, cos, and tan respectively — no separate memorisation needed if you know the top three rows well.",
        "tan 90° and cot 0° are undefined because they'd require dividing by zero (cos 90° = 0 and sin 0° = 0 respectively) — a classic 'why' that examiners like to ask."
      ]},
    {type:'theorem', heading:"Trigonometric Identities",
      items:[
        "<b>Identity 1:</b> <span class='mathf'>sin²θ + cos²θ = 1</span>.",
        "<b>Identity 2:</b> <span class='mathf'>1 + tan²θ = sec²θ</span>.",
        "<b>Identity 3:</b> <span class='mathf'>1 + cot²θ = cosec²θ</span>.",
        "All three come from Pythagoras theorem applied to a right triangle with hypotenuse 1 — they're not independent facts, they're one geometric fact seen three ways.",
        "Proving identities generally means picking one side (usually the more complex one), converting everything to sin θ and cos θ, and simplifying algebraically until it matches the other side."
      ]},
    {type:'concept', heading:"Complementary Angles",
      items:[
        "Two angles are complementary if they add to 90°. Key swaps: <span class='mathf'>sin(90°−θ) = cos θ</span>, <span class='mathf'>cos(90°−θ) = sin θ</span>, <span class='mathf'>tan(90°−θ) = cot θ</span>, <span class='mathf'>sec(90°−θ) = cosec θ</span> (and vice versa)."
      ]},
    {type:'extra', items:[
        "'Trigonometry' comes from Greek: <i>trigonon</i> (triangle) + <i>metron</i> (measure) — literally 'triangle measurement'. The subject dates back to ancient Greek and Indian astronomers charting the stars.",
        "The Indian mathematician <b>Aryabhata</b> (5th century CE) is credited with some of the earliest known sine-like tables, calling the ratio 'jya' — a term that, through translation chains via Arabic and Latin, eventually became the modern word 'sine'.",
        "Modern GPS, sound engineering, and computer graphics all run on trigonometric functions constantly — every rotation you see in a video game or 3D animation is computed using sin and cos."
      ]},
    {type:'facts', items:[
        "Hipparchus of ancient Greece (2nd century BCE) is often called the 'father of trigonometry' for compiling the earliest known trigonometric table — over 500 years before Aryabhata's sine tables appeared in India.",
        "The word 'sine' has a genuinely strange journey: Sanskrit <i>jya/jiva</i> (chord) → phonetically borrowed into Arabic as the meaningless <i>jiba</i> → misread by later scholars as <i>jaib</i> ('bay' or 'fold') → translated into Latin as <i>sinus</i> ('bay') → English 'sine.' A centuries-old translation quirk accidentally named the function.",
        "Every rotation, wave, and vibration in physics and engineering — sound waves, alternating-current electricity, pendulum motion, radio signals — is mathematically described using sine and cosine functions.",
        "Digital music synthesis, from keyboard apps to phone speakers, builds every sound by combining sine waves of different frequencies — a direct, modern-day descendant of the exact ratios memorised in this chapter."
      ]},
    {type:'trick', items:[
        "When simplifying a trig expression, converting everything to <b>sin θ and cos θ</b> first is almost always the fastest route, even if the question is stated in tan, cot, sec, or cosec.",
        "For 'evaluate' questions mixing multiple standard angles, group terms so complementary-angle pairs cancel neatly before you substitute numeric values.",
        "If a value like sin θ = 2 or cos θ = 1.5 appears in a question, it's impossible — sin and cos always lie between −1 and 1, so such a question is testing whether you catch the contradiction."
      ]}
  ],

{
  id:9, title:"Some Applications of Trigonometry", icon:"trigapp", color:"#ff7a6b",
  tagline:"Heights and distances — using an angle and a tape measure to size up towers, kites, and clifftops without climbing them.",
  sections:[
    {type:'concept', heading:"Line of Sight, Elevation & Depression",
      items:[
        "<b>Line of sight:</b> the imaginary line from the observer's eye to the object being viewed.",
        "<b>Angle of elevation:</b> angle between the horizontal and the line of sight when the object is <b>above</b> the observer's eye level — you tilt your head up to see it.",
        "<b>Angle of depression:</b> angle between the horizontal and the line of sight when the object is <b>below</b> the observer's eye level — you tilt your head down to see it.",
        "Key relationship: the angle of depression from the top of an object equals the angle of elevation from the bottom, because the horizontal lines at both positions are parallel and the line of sight is a transversal (alternate interior angles)."
      ]},
    {type:'concept', heading:"Setting Up the Right Triangle",
      items:[
        "Every problem in this chapter reduces to a right triangle — the object's height/distance is one leg, the known distance is another leg, and the angle connects them via sin, cos, or tan.",
        "Standard workflow: draw a clear labelled diagram, mark the right angle, label the given angle and side, choose the trig ratio that connects the <b>known side</b> to the <b>unknown side</b>, then solve.",
        "A very common setup: the height of the object is the <b>opposite</b> side to the angle of elevation, and the horizontal distance from the observer is the <b>adjacent</b> side — so <span class='mathf'>tan θ</span> connects them directly.",
        "Always keep the observer's height (if given, e.g. 'a person 1.5 m tall') in mind — add or subtract it correctly from the final answer if the question asks for the total height of a structure."
      ]},
    {type:'theorem', heading:"Two-Observation & Multi-Triangle Problems",
      items:[
        "For two-observation problems (e.g. angle changes as someone walks toward a tower, or two angles are measured from two different points), form two separate right-triangle equations and solve them simultaneously — this is where Chapter 3's algebra skills return.",
        "For problems involving two objects of different heights (e.g. a building and a tower on the same ground level, or a bird and its reflection in a lake), draw one combined diagram with a single common horizontal line, then form multiple right triangles sharing sides.",
        "When a distance is 'increased' or 'decreased' by walking towards/away from an object, represent the change algebraically (e.g. original distance = d, new distance = d − x) so both equations share the correct unknowns."
      ]},
    {type:'extra', items:[
        "This exact technique — combining a known baseline distance with two angles of elevation — is called <b>triangulation</b>, and it's how 19th-century surveyors calculated the height of Mount Everest without ever climbing it, using theodolites from miles away.",
        "Air traffic controllers and coast guard rescue teams still use angle-of-elevation/depression calculations (now automated by radar software) to estimate the altitude and distance of aircraft or ships.",
        "The Great Trigonometric Survey of India (started 1802) used these same height-and-distance principles to map the entire Indian subcontinent and first accurately measured the height of the Himalayan peaks."
      ]},
    {type:'facts', items:[
        "Radhanath Sikdar, an Indian mathematician working as 'Chief Computer' for the Great Trigonometrical Survey, is widely credited with the 1852 calculation that first identified 'Peak XV' — later named Mount Everest — as the world's highest mountain, using exactly this triangulation method, without ever setting foot on the mountain itself.",
        "Ancient Egyptian builders used a simple angle-and-shadow ratio called a <i>seked</i> to design the precise, consistent slope of the pyramids over 4000 years ago — one of the earliest recorded practical applications of these ideas.",
        "Modern drone and satellite mapping software still performs essentially the same 'measure two angles, solve the triangle' calculation taught here — just automated and completed in milliseconds instead of by hand with a theodolite.",
        "Lighthouse keepers and ship navigators historically used angle-of-depression sightings to estimate a ship's distance from shore, long before radar and GPS existed — a direct maritime application of this chapter."
      ]},
    {type:'trick', items:[
        "If a question mentions 'the angle of elevation changes from θ₁ to θ₂ as the observer walks a distance d towards the tower', always let the final unknown distance be x, express the original distance as (x + d), and use tan θ₁ and tan θ₂ to form two equations in h and x.",
        "For 'top of a tower' vs 'top of a building' comparisons, sketch both structures on the <b>same</b> horizontal ground line before writing any equation — a rushed diagram is the #1 cause of setup errors in this chapter.",
        "Answers should almost always come out to 'nice' numbers when using 30°, 45°, or 60° — if your tan value produces an ugly decimal, it's worth rechecking whether you picked the correct side as opposite vs adjacent."
      ]}
  ],
  formulas:[
    ["Height using elevation angle","h = d · tan θ"],
    ["Distance using elevation angle","d = h / tan θ"],
    ["Angle of depression = angle of elevation","(from the two ends of the same line of sight)"],
    ["Opposite side (general)","opposite = hypotenuse · sin θ"],
    ["Adjacent side (general)","adjacent = hypotenuse · cos θ"],
    ["Line of sight length (hypotenuse)","hypotenuse = h / sin θ  =  d / cos θ"],
    ["Total height with observer's eye-level","Total height = h(object) + observer's height"],
    ["Height from two elevation angles at points d apart","h = d / (cot θ₁ − cot θ₂)"],
    ["Distance walked towards the tower (angle θ₁→θ₂)","d = h(cot θ₁ − cot θ₂)"]
  ],
  flashcards:[
    {q:"What is the angle of elevation?", a:"Angle between the horizontal and the line of sight, looking up"},
    {q:"What is the angle of depression?", a:"Angle between the horizontal and the line of sight, looking down"},
    {q:"Which ratio connects tower height, distance, and elevation angle?", a:"tan θ = height / distance"},
    {q:"True or false: angle of depression from the top equals angle of elevation from the bottom.", a:"True (alternate angles, parallel horizontals)"},
    {q:"What technique combines angles from two known points to find a height?", a:"Triangulation"},
    {q:"Who is widely credited with the 1852 calculation identifying Everest as the highest peak?", a:"Radhanath Sikdar"},
    {q:"Hypotenuse in terms of height and sin θ?", a:"hypotenuse = height / sin θ"}
  ]
},
{
  id:10, title:"Circles", icon:"circles", color:"#c9a6ff",
  tagline:"Where a straight line touches a curve at exactly one point — the geometry of tangents.",
  sections:[
    {type:'concept', heading:"Tangent vs Secant vs Chord",
      items:[
        "A <b>tangent</b> to a circle is a line that touches the circle at exactly <b>one point</b> (the point of contact). A <b>secant</b> intersects the circle at two points. A <b>chord</b> is the line segment joining any two points on the circle.",
        "A tangent is the limiting case of a secant, as the two intersection points of the secant merge into one — imagine rotating a secant line until it just grazes the circle.",
        "At any point on a circle, there is exactly <b>one</b> tangent line — this is a useful fact when a question asks you to justify uniqueness."
      ]},
    {type:'theorem', heading:"The Two Core Theorems",
      items:[
        "<b>Theorem 1:</b> the tangent at any point of a circle is <b>perpendicular</b> to the radius through the point of contact. This single fact is the key to almost every numerical problem in the chapter — it instantly gives you a right angle to work with.",
        "<b>Theorem 2 (Equal tangents):</b> the lengths of the two tangents drawn from an external point to a circle are <b>equal</b>.",
        "Combining both theorems: the line joining the external point to the centre <b>bisects the angle</b> between the two tangents, and also bisects the angle between the two radii to the points of contact — this creates two congruent right triangles, which is the standard proof technique for this chapter."
      ]},
    {type:'concept', heading:"Number of Tangents From a Point",
      items:[
        "From a point <b>inside</b> the circle: <b>no tangent</b> can be drawn (every line through it is a secant or passes through the circle).",
        "From a point <b>on</b> the circle: exactly <b>one</b> tangent can be drawn (Theorem 1 applies directly).",
        "From a point <b>outside</b> the circle: exactly <b>two</b> tangents can be drawn, and they are equal in length (Theorem 2)."
      ]},
    {type:'concept', heading:"Solving Tangent-Length Problems",
      items:[
        "Whenever a tangent and radius meet at the point of contact, immediately mark a <b>90° angle</b> there — this converts the problem into a right-triangle (Pythagoras) calculation involving the radius, the tangent length, and the distance from the external point to the centre.",
        "<b>Quadrilateral circumscribing a circle:</b> if a quadrilateral's all four sides touch a circle (the circle is inscribed in it), then the sums of its opposite sides are equal — a direct, elegant consequence of the equal-tangents theorem applied to all four vertices.",
        "For problems combining a triangle and its inscribed circle (incircle), use the equal-tangents property at each vertex to set up equations connecting the side lengths and the tangent segments."
      ]},
    {type:'extra', items:[
        "Tangent-circle geometry isn't just theoretical — <b>gear design</b> in mechanical engineering relies on circles that are tangent to each other so that rotating gears mesh smoothly without slipping.",

  id:13, title:"Statistics", icon:"statistics", color:"#ffcf56",
  tagline:"Turning a pile of raw data into one honest number — mean, median, mode, and the ogive that finds them visually.",
  sections:[
    {type:'concept', heading:"Measures of Central Tendency (Grouped Data)",
      items:[
        "<b>Mean:</b> the 'balance point' of the data. For grouped data, three methods exist — <b>Direct Method</b>, <b>Assumed Mean Method</b>, and <b>Step-Deviation Method</b> — all give the same answer; step-deviation is fastest for large class widths.",
        "<b>Median:</b> the middle value once data is ordered — for grouped data it's found via the <b>cumulative frequency</b> table and a formula pinpointing the median class.",
        "<b>Mode:</b> the most frequently occurring value — for grouped data it's found by identifying the <b>modal class</b> (highest frequency) and applying a formula."
      ]},
    {type:'theorem', heading:"Key Formulas",
      items:[
        "<b>Direct mean:</b> <span class='mathf'>x̄ = Σfᵢxᵢ / Σfᵢ</span>.",
        "<b>Assumed mean:</b> <span class='mathf'>x̄ = a + (Σfᵢdᵢ/Σfᵢ)</span>, where dᵢ = xᵢ − a (a = any assumed mean, usually the class mark closest to the centre of the data).",
        "<b>Step-deviation mean:</b> <span class='mathf'>x̄ = a + h·(Σfᵢuᵢ/Σfᵢ)</span>, where uᵢ = (xᵢ−a)/h.",
        "<b>Median:</b> <span class='mathf'>l + [(n/2 − cf)/f] × h</span>, where l = lower limit of median class, cf = cumulative frequency before it, f = frequency of median class, h = class width.",
        "<b>Mode:</b> <span class='mathf'>l + [(f₁−f₀)/(2f₁−f₀−f₂)] × h</span>, where f₁ = modal class frequency, f₀ = preceding class frequency, f₂ = succeeding class frequency.",
        "<b>Empirical relationship</b> (a fast cross-check): <span class='mathf'>Mode = 3 Median − 2 Mean</span>."
      ]},
    {type:'concept', heading:"Cumulative Frequency & Ogive",
      items:[
        "A cumulative frequency table adds up frequencies as you move through classes — 'less than' type or 'more than' type.",
        "Plotting cumulative frequency against upper (or lower) class boundaries gives an <b>ogive</b> — a smooth S-shaped curve. The x-coordinate where the 'less than' and 'more than' ogives <b>intersect</b> gives the <b>median directly</b>, without any formula.",
        "Class marks (xᵢ) are always the <b>midpoint</b> of each class interval: <span class='mathf'>xᵢ = (upper limit + lower limit)/2</span> — needed for both the direct and assumed-mean methods."
      ]},
    {type:'extra', items:[
        "The step-deviation method is essentially a scaling trick — dividing every deviation by the common class width h shrinks the numbers you multiply, then you scale back up at the end by multiplying by h. It's the same 'simplify, solve, rescale' idea used throughout mathematics.",
        "Modern data science tools (spreadsheets, Python's pandas library, R) compute mean/median/mode instantly, but the underlying grouped-data formulas you're learning here are exactly what those tools use internally when your dataset is 'binned' into ranges, like age groups or income brackets.",
        "The word 'ogive' comes from architecture — it originally described the pointed arch shape seen in Gothic cathedral windows, later borrowed by statisticians because the cumulative frequency curve has a similar elongated S/arch profile."
      ]},
    {type:'facts', items:[
        "The word 'statistics' itself comes from the Latin <i>status</i> ('state') — the field originally grew out of governments collecting numerical data about their population and economy, literally 'state-istics.'",
        "<b>Florence Nightingale</b>, famous today as a pioneering nurse, was also a skilled statistician who invented a striking pie-chart variant (the 'polar area diagram') to visually convince the British government to improve army hospital sanitation — a chart credited with saving lives.",
        "The empirical relationship Mode = 3 Median − 2 Mean is only an <b>approximation</b>, valid for moderately skewed distributions — it doesn't hold for every dataset, which is exactly why some exam questions ask you to verify it rather than assume it blindly.",
        "Modern 'big data' analytics still relies on grouped-frequency thinking exactly like this chapter — massive datasets are binned into ranges before mean, median, and mode are computed, because handling millions of raw individual values directly is impractical."
      ]},
    {type:'trick', items:[
        "Always choose the <b>assumed mean (a)</b> as the class mark of the class with the highest frequency, or simply the middle-most class — this keeps the deviations dᵢ small and arithmetic clean.",
        "For step-deviation, the class width h must be the <b>same</b> for every class — if class intervals are unequal, you must use the direct or assumed-mean method instead.",
        "In median/mode formulas, always double check whether the class intervals given are <b>continuous</b> (e.g. 10–20, 20–30) or need conversion from <b>inclusive form</b> (e.g. 10–19, 20–29) by adjusting boundaries by 0.5 before applying the formula."
      ]}
  ],
