<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f0d">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://math-mafia-vaanii.vercel.app/">
  <link rel="canonical" href="https://math-mafia-vaanii.vercel.app/">
  <title>Math Mafia — Opening the learning studio</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0f0d; --panel:#151a17; --edge:#2a332c; --gold:#d4af37; --cream:#f5efdf; --muted:#9ba69c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 10%,rgba(212,175,55,.09),transparent 38%),var(--bg); color:var(--cream); font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { width:min(100%,560px); text-align:center; border:1px solid var(--edge); background:rgba(21,26,23,.92); border-radius:20px; padding:clamp(28px,7vw,52px); box-shadow:0 24px 80px #0005; }
    .seal { display:grid; place-items:center; margin:0 auto 22px; width:68px; height:68px; border:2px solid var(--gold); border-radius:50%; color:var(--gold); font-weight:800; font-size:24px; letter-spacing:-1px; box-shadow:0 0 0 6px #d4af3712; }
    .eyebrow { color:var(--gold); font-size:12px; letter-spacing:.18em; font-weight:700; text-transform:uppercase; }
    h1 { margin:9px 0 10px; font-size:clamp(30px,7vw,44px); line-height:1.1; letter-spacing:-.04em; }
    p { color:var(--muted); margin:0 auto 24px; max-width:38ch; }
    a { display:inline-flex; justify-content:center; align-items:center; min-height:48px; padding:12px 22px; border-radius:9px; background:var(--gold); color:var(--bg); font-weight:750; text-decoration:none; }
    a:focus-visible { outline:3px solid var(--cream); outline-offset:4px; }
    .note { margin-top:18px; font-size:12px; color:var(--muted); }
    @media (prefers-reduced-motion:no-preference) { .seal { animation:arrive .45s ease both; } @keyframes arrive { from{transform:scale(.8);opacity:.3} to{transform:scale(1);opacity:1} } }
  </style>
  <script>
    window.location.replace("https://math-mafia-vaanii.vercel.app/");
  </script>
</head>
<body>
  <main>
    <div class="seal" aria-hidden="true">MM</div>
    <div class="eyebrow">Class 10 · Learning Studio</div>
    <h1>Math Mafia</h1>
    <p>Opening your learning studio with chapter resources, practice quizzes, timed tests, previous papers and shared challenges.</p>
    <a href="https://math-mafia-vaanii.vercel.app/">Continue to Math Mafia <span aria-hidden="true">&nbsp;→</span></a>
    <div class="note">Redirecting automatically. Use the button if you are not taken there.</div>
  </main>
</body>
</html>
